<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <header>
        <div class="head">
            <img src="./assets/primary-logo.svg" height="100px" width="140px" style="margin-left:100px;margin-top: 10px;">
            <p class="deliver"><b>Delivery in <span class="red">9 Mins</span><b></p>
            <input class="in" type="text" placeholder="Search for">
            <i class="fa fa-circle-user fa-2x" onclick="popUp()"><br><p class="l">Login</p></i>
            <i class="fa fa-cart-shopping fa-2x"><br><p class="l">Cart</p></i>
        </div>
    </header>
    
    <div class="aside-content">
        <div class="container">
            <div class="first" id="first-Div" onclick="allClick()">
                <img class="photo" src="./assets/veg.png">
                <p class="para">All</p>
            </div>
            <div class="first" onclick="freshVegetables()">
                <img  class="photo" src="./assets/freshVeg.png">
                <p class="para">Fresh <br> Vegetables</p>
            </div>
            <div class="first">
                <img  class="photo"  src="./assets/fruits.png">
                <p class="para">Fresh Fruits</p>
            </div>
            <div class="first">
                <img  class="photo"  src="./assets/flower.png">
                <p class="para">Flowers &<br>Leaves</p>
            </div>
            <div class="first">
                <img  class="photo"  src="./assets/grapes.png">
                <p class="para">Seasonal Pick</p>
            </div>
            <div class="first">
                <img  class="photo"  src="./assets/leafy.png">
                <p class="para">Leafy,Herbs &<br>Seasonings</p>
            </div>
            <div class="first">
                <img  class="photo"  src="./assets/exotic.png">
                <p class="para">Exotics &<br>Premium</p>
            </div>
            <div class="first side">
                <img  class="photo"  src="./assets/organic.png">
                <p class="para">Organics &<br>Hydroponics</p>
            </div>
        </div>
        <div class="content-section" id="content-visible">
            <!-- all items are printed  -->
        </div>
        <div class="float" id="floatContent">
            <input class="mobile-no" type="number" placeholder="Enter Phone Number">
            <div class="continue">Continue</div>
        </div>
    </div>
    <div class="content-section1" id="content-visible1">
            <!-- fruits are printed  -->
    </div>
</body>
</html>
